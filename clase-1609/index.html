
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Buscador de Usuarios - JavaScript II</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    >

</head>


<body class="bg-light">


    <!-- HEADER -->

    <header class="bg-dark text-white py-4 mb-4">

        <div class="container">

            <h1 class="mb-1">
                Buscador de Usuarios
            </h1>

            <p class="mb-0">
                JavaScript II - Fetch API + Módulos ES6
            </p>

        </div>

    </header>


    <!-- CONTENIDO PRINCIPAL -->

    <main class="container">


        <!-- FORMULARIO DE BÚSQUEDA -->

        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <h5 class="card-title">
                    Buscar usuario
                </h5>

                <div class="input-group">

                    <input
                        type="number"
                        id="usuarioId"
                        class="form-control"
                        placeholder="Ingrese un ID del 1 al 10"
                        min="1"
                        max="10"
                    >

                    <button
                        id="btnBuscar"
                        class="btn btn-primary"
                    >
                        Buscar
                    </button>

                </div>

            </div>

        </div>


        <!-- SPINNER -->

        <div
            id="spinner"
            class="text-center my-5 d-none"
        >

            <div
                class="spinner-border text-primary"
                role="status"
            >

                <span class="visually-hidden">
                    Cargando...
                </span>

            </div>

            <p class="mt-2 text-muted">
                Consultando API...
            </p>

        </div>


        <!-- MENSAJES -->

        <div id="mensaje"></div>


        <!-- RESULTADO -->

        <div
            id="resultado"
            class="row"
        ></div>


    </main>


    <!-- JAVASCRIPT -->

    <script type="module" src="./js/main.js"></script>

</body>

</html>
