<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- CSS propio -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container my-5">
    <h1 class="text-center mb-4">Pokédex (async/await)</h1>

    <!-- Buscador -->
    <div class="row mb-4">
      <div class="col-md-8 offset-md-2 d-flex">
        <input id="pokemonInput" type="text" class="form-control me-2" placeholder="Buscar Pokémon por nombre">
        <button id="searchBtn" class="btn btn-primary">Buscar</button>
      </div>
    </div>

    <!-- Spinner -->
    <div id="spinner" class="text-center d-none">
      <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>

    <!-- Contenedor de Cards -->
    <div id="pokemonContainer" class="row g-3"></div>
  </div>

  <!-- Script principal -->
  <script src="js/app.js"></script>
</body>
</html>
